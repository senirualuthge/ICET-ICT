<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Customer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box">
    <h1>Add Customer</h1>

    <form onsubmit="addCustomerOnAction(); return false;">

      <label for="txtName">Name</label>
      <input type="text" id="txtName" placeholder="Enter name"required >

      <label for="txtAge">Age</label>
      <input type="number" id="txtAge" placeholder="Enter age" required>

      <label for="txtAddress">Address</label>
      <input type="text" id="txtAddress" placeholder="Enter address" required>

      <label for="txtContact">Contact</label>
      <input type="text" id="txtContact" placeholder="Enter contact number" required>

      <button type="submit">Add Customer</button>
      <button type="reset" class="clear">Clear</button>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
