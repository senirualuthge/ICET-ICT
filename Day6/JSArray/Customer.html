    <div class="box">

        <form onsubmit="addCustomer(); return false;">

            <label for="txtName">Customer Name</label>

            <label for="cboGender">Gender</label>

                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <label for="txtName">Addreess </label>

            <label for="txtName">Age </label>
            <input type="text" id="txtName" placeholder="Enter  Age" >
            <label for="txtName">Contact </label>
            <input type="text" id="txtName" placeholder="Enter  Contact Number" >




            <button type="submit">Add Customer</button>

        </form>
