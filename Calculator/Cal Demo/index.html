<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <div class="screen">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>

    <border>
    <div class="keys" id="keys">
      <button data-act="clear">AC</button>
      <button data-act="back">&#9003;</button>
      <button data-act="percent">%</button>
      <button data-op="/">&divide;</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="*">&times;</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="-">&minus;</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+">+</button>

      <button data-num="0" class="span2">0</button>
      <button data-act="dot">.</button>
      <button data-act="equals">=</button>
    </div>
  
  </main>

  <script src="script.js"></script>
</body>
</html>
