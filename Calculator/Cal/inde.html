<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <div class="btns">

            <div class="screen">
                <div class="exp" id="exp"></div>
                <div class="val" id="val">0</div>
            </div>
                
        <table class="calc" border="1">
            <tr class="d1">
                <td><button class="btn">AC</button></td>
                <td><button class="btn">&#9003;</button></td>
                <td><button class="btn">%</button></td>
                <td><button class="btn">/</button></td>
            </tr>
            <tr class="d2">
                <td><button class="btn">7</button></td>
                <td><button class="btn">8</button></td>
                <td><button class="btn">9</button></td>
                <td><button class="btn">*</button></td>
            </tr>
            <tr class="d3">
                <td><button class="btn">4</button></td>
                <td><button class="btn">5</button></td>
                <td><button class="btn">6</button></td>
                <td><button class="btn">-</button></td>
            </tr>
            <tr class="d4">
                <td><button class="btn">1</button></td>
                <td><button class="btn">2</button></td>
                <td><button class="btn">3</button></td>
                <td><button class="btn">+</button></td>
            </tr>
            <tr class="d5">
                <td><button class="btn">0</button></td>
                <td><button class="btn">.00</button></td>

                <td><button class="btn">.</button></td>
                <td colspan="2"><button  class="eq">=</button></td>
            </tr>
        </table>
        </div>


    <script src="script.js"></script>
</body>
</html>
