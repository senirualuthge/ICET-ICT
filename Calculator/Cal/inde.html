<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <div class="btns">

            <div class="screen">
                <div class="exp" id="op"></div>
                <div class="val" id="a">0</div>
            </div>
                
        <table class="calc" border="1">
            <tr class="d1">
                <td><button class="btn" onclick="onClick('AC')">AC</button></td>
                <td><button class="btn" onclick="onClick('back')">&#9003;</button></td>
                <td><button class="btn" onclick="onClick('%')">%</button></td>
                <td><button class="btn" onclick="onClick('/')">/</button></td>
                </tr>
                <tr class="d2">
                <td><button class="btn" onclick="onClick('7')">7</button></td>
                <td><button class="btn" onclick="onClick('8')">8</button></td>
                <td><button class="btn" onclick="onClick('9')">9</button></td>
                <td><button class="btn" onclick="onClick('*')">*</button></td>
                </tr>
                <tr class="d3">
                <td><button class="btn" onclick="onClick('4')">4</button></td>
                <td><button class="btn" onclick="onClick('5')">5</button></td>
                <td><button class="btn" onclick="onClick('6')">6</button></td>
                <td><button class="btn" onclick="onClick('-')">&#8722;</button></td>
                </tr>
                
                <tr class="d4">
                <td><button class="btn" onclick="onClick('1')">1</button></td>
                <td><button class="btn" onclick="onClick('2')">2</button></td>
                <td><button class="btn" onclick="onClick('3')">3</button></td>
                <td><button class="btn" onclick="onClick('+')">+</button></td>
                </tr>

                <tr class="d5">
                <td><button class="btn" onclick="onClick('0')">0</button></td>
                <td><button class="btn" onclick="onClick('00')">00</button></td>
                <td><button class="btn" onclick="onClick('.')">.</button></td>
                <td><button class="eq" onclick="onClick('=')"> = </button></td>
                </tr>
            </tr>
            </table>
        </div>


    <script src="script.js"></script>
</body>
</html>
