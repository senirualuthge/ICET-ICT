<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="nav">
        <a class="active" href="Customer.html">Customers</a>
        <a href="Item.html">Items &rarr;</a>
    </nav>

    <div class="box">
        <h1>Add Customer</h1>

        <form onsubmit="addCustomer(); return false;">

            <label for="txtName">Customer Name</label>
            <input type="text" id="txtName" placeholder="Enter customer name" >

            <label for="cboGender">Gender</label>
            <select id="cboGender" required>
                <option value="">-- Select gender --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <label for="txtAddress">Address</label>
            <input type="text" id="txtAddress" placeholder="Enter address">

            <label for="txtAge">Age</label>
            <input type="number" id="txtAge" placeholder="Enter age">

            <label for="txtContact">Contact</label>
            <input type="text" id="txtContact" placeholder="Enter contact number">




            <button type="submit">Add Customer</button>
            <button type="button" class="clear" onclick="clearForm()">Clear</button>
        </form>
    </div>

    <div class="box">
        <h1>Customer List</h1>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Address</th>
                    <th>Age</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody id="tblCustomers"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
